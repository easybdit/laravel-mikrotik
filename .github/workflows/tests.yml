name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # composer.json is the single source of truth for "what does this
  # package claim to support" -- every combination below was individually
  # verified resolvable with `composer require --dry-run -W` (see
  # CHANGELOG.md, P11) before being added; a PHP/testbench pair that
  # Composer cannot actually install is never listed here.
  test:
    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # testbench ^8.0 -> Laravel 10, needs PHP 8.1+
          - php: '8.1'
            testbench: '^8.0'
          - php: '8.2'
            testbench: '^8.0'
          - php: '8.3'
            testbench: '^8.0'
          - php: '8.4'
            testbench: '^8.0'
          # testbench ^9.0 -> Laravel 11, needs PHP 8.2+
          - php: '8.2'
            testbench: '^9.0'
          - php: '8.3'
            testbench: '^9.0'
          - php: '8.4'
            testbench: '^9.0'
          # testbench ^10.0 -> Laravel 12, needs PHP 8.2+
          - php: '8.2'
            testbench: '^10.0'
          - php: '8.3'
            testbench: '^10.0'
          - php: '8.4'
            testbench: '^10.0'
          # testbench ^11.0 -> Laravel 13, needs PHP 8.3+
          - php: '8.3'
            testbench: '^11.0'
          - php: '8.4'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Select testbench version (no code changes, dev-only)
        run: composer require "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Run test suite
        run: vendor/bin/phpunit

  # A single, separate job (not part of the matrix above) that runs the
  # exact same suite against a real MySQL service container instead of
  # Testbench's default SQLite :memory:, per this package's own
  # documented "SQLite and MySQL" support (see database/migrations/).
  # Testbench's config loader honors these DB_* environment variables via
  # Laravel's own stock, env()-based config/database.php, falling back
  # to SQLite only if DB_CONNECTION were left unset.
  mysql:
    name: MySQL compatibility (PHP 8.4 / Testbench ^11.0)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Select testbench version (no code changes, dev-only)
        run: composer require "orchestra/testbench:^11.0" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Run test suite against MySQL
        run: vendor/bin/phpunit

  validate:
    name: composer validate + php -l
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Validate composer.json/composer.lock
        run: composer validate --no-check-publish

      - name: PHP syntax check
        run: |
          find src tests config database -name '*.php' -print0 \
            | xargs -0 -n1 php -l
